<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="ticket-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Canvas with App Radius for Standalone preview -->
  <rect width="512" height="512" rx="116" fill="#3500FF"/>

  <!-- Centered Logo Group: Speed lines + Tilted Ticket with 'F' -->
  <g transform="translate(76, 76)">
    <!-- 3 Speed Lines on the left -->
    <rect x="20" y="90" width="54" height="20" rx="10" fill="#FFFFFF" />
    <rect x="-10" y="146" width="84" height="22" rx="11" fill="#FFFFFF" />
    <rect x="10" y="202" width="58" height="20" rx="10" fill="#FFFFFF" />

    <!-- White Ticket Body with Cutouts -->
    <g transform="translate(85, 20) rotate(-5.5 110 160)" filter="url(#ticket-shadow)">
      <!-- Ticket Path -->
      <path
        d="M 24 0
           L 155 0
           A 30 30 0 0 0 195 40
           L 195 285
           A 22 22 0 0 1 173 307
           A 22 22 0 0 1 151 285
           L 110 285
           A 22 22 0 0 1 88 307
           A 22 22 0 0 1 66 285
           L 24 285
           A 24 24 0 0 1 0 261
           L 0 24
           A 24 24 0 0 1 24 0 Z"
        fill="#FFFFFF"
      />

      <!-- Bold Letter 'F' inside Ticket -->
      <path
        d="M 60 70
           H 148
           V 104
           H 98
           V 130
           H 140
           V 162
           H 98
           V 228
           H 60
           Z"
        fill="#3500FF"
      />
    </g>
  </g>
</svg>
